name: Alpha checks
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eternalia
          POSTGRES_USER: eternalia
          POSTGRES_PASSWORD: ci-temp-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eternalia -d eternalia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://eternalia:ci-temp-password@127.0.0.1:5432/eternalia
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Exercise existing alpha domain and HTTP tests
        run: npm run test:alpha
      - name: Build contracts, Nest and Nuxt
        run: npm run build
      - name: Check Nuxt types
        run: npm run typecheck -w @eternalia/web
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Exercise alpha PostgreSQL persistence and author guard tests
        run: npm run test:db

  compile-and-typecheck:
    # Independent of the domain test job: compilation errors must remain visible
    # even when a domain regression stops the other job early.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build contracts, Nest and Nuxt independently
        run: npm run build
      - name: Check Nuxt types independently
        run: npm run typecheck -w @eternalia/web
