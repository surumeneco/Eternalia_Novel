name: CAT Draft syntax validation (alpha author and publication)

on:
  push:
    branches:
      - feature/alpha-auth-stale-publication-20261101-queue-b
    paths:
      - 'docs/cat/drafts/alpha-author-*.md'
      - 'docs/cat/drafts/alpha-stale-publication-revisions.md'
      - 'docs/cat/drafts/anonymous-author-route-protection.md'
      - '.github/workflows/cat-alpha-auth-draft.yml'

permissions:
  contents: read

jobs:
  draft-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout pinned CAT-TDD runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: surumeneco/CAT-TDD
          ref: ee929dfa655d0dd738692990bebe7f5de77e4f31
          path: cat-tdd
          persist-credentials: false
      - name: Canonical Draft syntax and references
        run: |
          python3 cat-tdd/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py --files \
            docs/cat/drafts/alpha-author-ambiguous-content-type.md \
            docs/cat/drafts/alpha-author-canonical-app-origin.md \
            docs/cat/drafts/alpha-author-json-content-type.md \
            docs/cat/drafts/alpha-stale-publication-revisions.md \
            docs/cat/drafts/anonymous-author-route-protection.md
      - name: Declare evidence boundary
        run: |
          echo 'Draft syntax only. No normative CAT confirmation, real Discord OAuth2/PKCE or browser acceptance.' >> "$GITHUB_STEP_SUMMARY"
