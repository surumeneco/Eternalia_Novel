name: CAT Draft syntax validation (alpha editor)

on:
  push:
    branches:
      - feature/alpha-editor-surrogate-boundaries-20261101-queue-b
    paths:
      - 'docs/cat/drafts/editor-*.md'
      - '.github/workflows/cat-alpha-editor-draft.yml'

permissions:
  contents: read

jobs:
  draft-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout pinned CAT-TDD runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: surumeneco/CAT-TDD
          ref: ee929dfa655d0dd738692990bebe7f5de77e4f31
          path: cat-tdd
          persist-credentials: false
      - name: Canonical Draft syntax and references
        run: |
          python3 cat-tdd/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py --files \
            docs/cat/drafts/editor-grapheme-fallback.md \
            docs/cat/drafts/editor-halfwidth-kana-grapheme-fallback.md \
            docs/cat/drafts/editor-hangul-jamo-grapheme-fallback.md \
            docs/cat/drafts/editor-utf16-surrogate-boundaries.md
      - name: Declare evidence boundary
        run: |
          echo 'Draft syntax only. No normative CAT Gate, Android/Gboard/IME or visual acceptance.' >> "$GITHUB_STEP_SUMMARY"
