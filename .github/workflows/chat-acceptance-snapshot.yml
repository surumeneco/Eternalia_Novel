name: Actual reader regression verification
on:
  push:
    branches: ['infra/chat-acceptance-snapshot-853ee0c0']
permissions:
  contents: read
jobs:
  cat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eternalia_http
          POSTGRES_USER: eternalia
          POSTGRES_PASSWORD: ci-temp-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U eternalia -d eternalia_http"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgres://eternalia:ci-temp-password@127.0.0.1:5432/eternalia_http
      NODE_ENV: test
      HTTP_ACCEPTANCE_DISPOSABLE_DB: '1'
      HTTP_BASE_URL: http://127.0.0.1:34110
      HTTP_API_URL: http://127.0.0.1:34111
      API_PORT: '34111'
      NITRO_PORT: '34110'
      NUXT_API_INTERNAL_URL: http://127.0.0.1:34111
      APP_ORIGIN: http://127.0.0.1:34110
      DISCORD_CLIENT_ID: '123456789012345678'
      DISCORD_CLIENT_SECRET: test-placeholder-not-a-discord-secret
      DISCORD_AUTHOR_USER_ID: '123456789012345678'
      HTTP_ACCEPTANCE_TEST_AUTHOR_ID: '123456789012345678'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'c1e24475a964ebf85ef737bedf0aad0658a13553'
          persist-credentials: false
          path: project
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: d42557a7b8318925f172b401d4e2bf55c4d230c7
          persist-credentials: false
          path: cat
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact product and prepare Chromium
        working-directory: project
        run: |
          test "$(git rev-parse HEAD)" = 'c1e24475a964ebf85ef737bedf0aad0658a13553'
          git checkout -B feature/required-ia-regressions 'c1e24475a964ebf85ef737bedf0aad0658a13553'
          test "$(git -C ../cat rev-parse HEAD:.cat-system)" = eeb6cdbd008dedc261f1df380b92f8052be0c045
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 vitest@3.2.4
          npx playwright install --with-deps chromium
          npm run build
          npm run db:migrate
      - name: Required IA regression Green
        working-directory: project
        run: |
          set -euo pipefail
          export HTTP_FIXTURE_FILE="$RUNNER_TEMP/fixture.json"
          D="$RUNNER_TEMP/cat-evidence"
          mkdir -p "$D"
          export CAT_IA_OBSERVATIONS="$D/observations.jsonl"
          F=../cat/.cat-system/scripts/cat_flow.py
          node scripts/seed-http-acceptance.mjs
          node apps/api/dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          A=$!
          node apps/web/.output/server/index.mjs > "$RUNNER_TEMP/web.log" 2>&1 &
          B=$!
          trap 'kill "$A" "$B" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS "$HTTP_BASE_URL/" >/dev/null && curl -fsS "$HTTP_API_URL/api/health" >/dev/null && break; sleep 1; done
          curl -fsS "$HTTP_BASE_URL/" >/dev/null
          failed=0
          for id in reader-required-ia admin-required-ia; do
            P="Lifecycle/Works/New/eternalia.ui.$id"
            W="$P/work.json"
            mkdir -p "$P/CAT/Confirmed" "$D/$id"
            python "$F" conformance --work "$W" --kind process-closure | tee "$D/$id/closure.json"
            python "$F" compile --work "$W" --kind model | tee "$D/$id/model.json"
            python "$F" conformance --work "$W" --kind model-conformance | tee "$D/$id/model-conformance.json"
            for k in vectors queue tests; do
              python "$F" compile --work "$W" --kind "$k" | tee "$D/$id/$k.json"
            done
            set +e
            python "$F" run --work "$W" --id green-required-ia --execute | tee "$D/$id/green.json"
            status="${PIPESTATUS[0]}"
            set -e
            echo "$status" > "$D/$id/green-exit.txt"
            if [ "$status" = 0 ]; then
              python "$F" queue-state --work "$W" --evidence "$P/.cat-flow/evidence/green-required-ia.json" | tee "$D/$id/queue-state.json" || failed=1
            else
              failed=1
            fi
            cp -r "$P/.cat-flow" "$D/$id/work-evidence"
            cp -r "$P/CAT/Confirmed" "$D/$id/confirmed"
            cp -r "$P/CAT/Generated" "$D/$id/generated"
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: required-ia-green
          path: ${{ runner.temp }}/cat-evidence/
