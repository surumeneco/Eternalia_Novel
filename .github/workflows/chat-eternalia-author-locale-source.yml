name: Chat read-only author management locale source audit
on:
  push:
    branches:
      - infra/chat-eternalia-snapshot-20261112b
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: 45bb7a98f1e1cd749b9fbfad97688fe497f76ce8
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "45bb7a98f1e1cd749b9fbfad97688fe497f76ce8"
          test "$(git rev-parse HEAD^{tree})" = "ad775978332c6e260215fad33f6e48670ddb0a16"
          mkdir -p out
          git archive --format=tar HEAD | gzip -n > out/source.tar.gz
          {
            echo "repo=surumeneco/Eternalia_Novel"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "tracked_files=$(git ls-tree -r --name-only HEAD | wc -l)"
            sha256sum out/source.tar.gz
          } > out/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: author-management-45bb7a-source
          path: out/
          retention-days: 1
