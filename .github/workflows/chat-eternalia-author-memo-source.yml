name: Chat read-only author memo source preflight
on:
  push:
    branches:
      - infra/chat-eternalia-snapshot-20261112b
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: f23dfa4fe0014240a51ea4588a299d66fb8150c2
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f23dfa4fe0014240a51ea4588a299d66fb8150c2"
          test "$(git rev-parse HEAD^{tree})" = "0bd6cbdaa885f56d3b524de2d0013a93162c3a3c"
          mkdir -p out
          git archive --format=tar HEAD | gzip -n > out/source.tar.gz
          {
            echo "repo=surumeneco/Eternalia_Novel"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "tracked_files=$(git ls-tree -r --name-only HEAD | wc -l)"
            sha256sum out/source.tar.gz
          } > out/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: author-memo-f23dfa4-source
          path: out/
          retention-days: 1
