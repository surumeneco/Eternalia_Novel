name: Chat read-only Eternalia reader DOM source audit
on:
  push:
    branches:
      - infra/chat-eternalia-snapshot-20261112b
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned code
        uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: b4f631211168623eb90ff8855d791dae7730554e
          persist-credentials: false
      - name: Archive exact tracked tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b4f631211168623eb90ff8855d791dae7730554e"
          test "$(git rev-parse HEAD^{tree})" = "a026b10a0839468510e64e5e500b435a2179c16a"
          mkdir -p out
          git archive --format=tar HEAD | gzip -n > out/source.tar.gz
          {
            echo "repo=surumeneco/Eternalia_Novel"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "tracked_files=$(git ls-tree -r --name-only HEAD | wc -l)"
            sha256sum out/source.tar.gz
          } > out/manifest.txt
      - name: Upload pinned archive
        uses: actions/upload-artifact@v4
        with:
          name: eternalia-reader-dom-source-b4f631
          path: out/
          retention-days: 1
