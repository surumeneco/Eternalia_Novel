name: Chat read-only etymology verification source
on:
  push:
    branches: [infra/chat-eternalia-snapshot-20261112b]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: 96177a2769a039c911a208a1f042d92cd35e9800
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "96177a2769a039c911a208a1f042d92cd35e9800"
          test "$(git rev-parse HEAD^{tree})" = "0f5a189da0f07b21004f0344aefed387dd26eab8"
          mkdir -p out
          git archive --format=tar HEAD | gzip -n > out/source.tar.gz
          {
            echo "repo=surumeneco/Eternalia_Novel"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "tracked_files=$(git ls-tree -r --name-only HEAD | wc -l)"
            sha256sum out/source.tar.gz
          } > out/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: etymology-96177a2-source
          path: out/
          retention-days: 1
