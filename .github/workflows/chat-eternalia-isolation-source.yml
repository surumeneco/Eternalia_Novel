name: Chat read-only Eternalia source for isolation audit
on:
  push:
    branches:
      - infra/chat-eternalia-snapshot-20261112b
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: 066eba289db695c050ab25708decba7df1aecf19
          persist-credentials: false
      - name: Verify read-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "066eba289db695c050ab25708decba7df1aecf19"
          test "$(git rev-parse HEAD^{tree})" = "97f01723ad4e1b10ba07d92debba1d9f462ddbda"
          mkdir -p out
          git archive --format=tar HEAD | gzip -n > out/source.tar.gz
          {
            echo "repo=surumeneco/Eternalia_Novel"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "tracked_files=$(git ls-tree -r --name-only HEAD | wc -l)"
            sha256sum out/source.tar.gz
          } > out/manifest.txt
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: eternalia-search-isolation-source-066eba
          path: out/
          retention-days: 1
