name: Chat read-only Eternalia snapshot
on:
  push:
    branches:
      - infra/chat-eternalia-snapshot-20261115
    paths:
      - .github/workflows/chat-eternalia-snapshot.yml
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive immutable source
        shell: bash
        run: |
          set -euo pipefail
          commit=5997cb491894f463ec630f6d65b3a92078895910
          tree=a697334f9af0b5cda46695bddb82189d2e97fff5
          test "$(git rev-parse "$commit^{tree}")" = "$tree"
          mkdir -p snapshot
          git archive --format=tar --output=snapshot/source.tar "$commit"
          sha256sum snapshot/source.tar > snapshot/source.tar.sha256
          printf '%s\n' 'repository=surumeneco/Eternalia_Novel' "commit=$commit" "tree=$tree" > snapshot/identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: eternal-novel-read-only-5997cb
          path: snapshot/
          if-no-files-found: error
          retention-days: 1
