name: Chat read-only UI6 follow-on snapshot
on:
  push:
    branches: [infra/chat-eternalia-snapshot-20261112b]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: 079ed09de9997e4a70fe0703f9954588a87a72be
          persist-credentials: false
      - name: Archive pinned source tree only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "079ed09de9997e4a70fe0703f9954588a87a72be"
          test "$(git rev-parse HEAD^{tree})" = "458c5ba3ef3bb890e85c31162795073536d31a98"
          mkdir -p out
          git archive --format=tar HEAD | gzip -n > out/source.tar.gz
          {
            echo "repo=surumeneco/Eternalia_Novel"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "tracked_files=$(git ls-tree -r --name-only HEAD | wc -l)"
            sha256sum out/source.tar.gz
          } > out/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ui6-followon-079ed09-source
          path: out/
          retention-days: 1
