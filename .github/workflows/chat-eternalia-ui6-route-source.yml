name: Chat read-only UI6 route source
on:
  push:
    branches: [infra/chat-eternalia-snapshot-20261112b]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: 2bc3cc5c3e295b94828737eacad33c62bd368f6f
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2bc3cc5c3e295b94828737eacad33c62bd368f6f"
          test "$(git rev-parse HEAD^{tree})" = "004dd8548d1ef769485a735389b218310a43f9e4"
          mkdir -p out
          git archive --format=tar HEAD | gzip -n > out/source.tar.gz
          {
            echo "repo=surumeneco/Eternalia_Novel"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "tracked_files=$(git ls-tree -r --name-only HEAD | wc -l)"
            sha256sum out/source.tar.gz
          } > out/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ui6-route-2bc3cc5-source
          path: out/
          retention-days: 1
