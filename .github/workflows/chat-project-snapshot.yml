name: Chat read-only source snapshot
on:
  push:
    branches:
      - infra/chat-eternalia-snapshot-20261112b
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: 98925abe05c82c39023de1cba2570206bda174b3
          persist-credentials: false
      - name: Verify commit and archive read-only Git tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "98925abe05c82c39023de1cba2570206bda174b3"
          mkdir -p snapshot-output
          git archive --format=tar HEAD | gzip -n > snapshot-output/source.tar.gz
          {
            echo "repo=surumeneco/Eternalia_Novel"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "tracked_files=$(git ls-tree -r --name-only HEAD | wc -l)"
            sha256sum snapshot-output/source.tar.gz
          } > snapshot-output/manifest.txt
      - name: Upload source archive (no build)
        uses: actions/upload-artifact@v4
        with:
          name: eternalia-source-98925abe
          path: snapshot-output/
          retention-days: 1
