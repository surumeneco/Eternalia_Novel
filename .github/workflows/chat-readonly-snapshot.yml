name: Chat read-only fixed project snapshot
on:
  push:
    branches: [infra/chat-snapshot-59c2590-20261124]
    paths: [.github/workflows/chat-readonly-snapshot.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: 59c25909adc21f5f75063301901a82767a50b541
          persist-credentials: false
      - name: Verify and archive fixed commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "59c25909adc21f5f75063301901a82767a50b541"
          test "$(git rev-parse HEAD^{tree})" = "b7fc4d2af91850d95e0a5d8d54e5a39ccd69255d"
          mkdir -p "$RUNNER_TEMP/chat-snapshot"
          git archive --format=tar.gz --output="$RUNNER_TEMP/chat-snapshot/project.tar.gz" HEAD
          cd "$RUNNER_TEMP/chat-snapshot"
          sha256sum project.tar.gz > SHA256SUMS
          printf '%s\n' '{"repository":"surumeneco/Eternalia_Novel","commit":"59c25909adc21f5f75063301901a82767a50b541","tree":"b7fc4d2af91850d95e0a5d8d54e5a39ccd69255d"}' > manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: project-snapshot-59c2590
          path: ${{ runner.temp }}/chat-snapshot/
          retention-days: 1
