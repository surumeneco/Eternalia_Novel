name: Chat read-only fixed project snapshot
on:
  push:
    branches: [infra/chat-snapshot-5945f58-20261124]
    paths: [.github/workflows/chat-readonly-snapshot.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: 5945f5890f62b7ecbfd7ec75dfb126d1d194906d
          persist-credentials: false
      - name: Verify and archive fixed commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5945f5890f62b7ecbfd7ec75dfb126d1d194906d"
          test "$(git rev-parse HEAD^{tree})" = "3f5775972cceab2cf93d7ae2813905bc7b06375b"
          mkdir -p "$RUNNER_TEMP/chat-snapshot"
          git archive --format=tar.gz --output="$RUNNER_TEMP/chat-snapshot/project.tar.gz" HEAD
          cd "$RUNNER_TEMP/chat-snapshot"
          sha256sum project.tar.gz > SHA256SUMS
          printf '%s\n' '{"repository":"surumeneco/Eternalia_Novel","commit":"5945f5890f62b7ecbfd7ec75dfb126d1d194906d","tree":"3f5775972cceab2cf93d7ae2813905bc7b06375b"}' > manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: project-snapshot-5945f58
          path: ${{ runner.temp }}/chat-snapshot/
          retention-days: 1
