name: Chat read-only fixed project snapshot
on:
  push:
    branches: [infra/chat-snapshot-2fe68c8b-20261124]
    paths: [.github/workflows/chat-readonly-snapshot.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: 2fe68c8b14b77f8dd2a9a2a51c777cf6adc0438a
          persist-credentials: false
      - name: Verify and archive fixed commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2fe68c8b14b77f8dd2a9a2a51c777cf6adc0438a"
          test "$(git rev-parse HEAD^{tree})" = "416cbe1e5e95576b626a1d1fb423ed5df5dd266f"
          mkdir -p "$RUNNER_TEMP/chat-snapshot"
          git archive --format=tar.gz --output="$RUNNER_TEMP/chat-snapshot/project.tar.gz" HEAD
          cd "$RUNNER_TEMP/chat-snapshot"
          sha256sum project.tar.gz > SHA256SUMS
          printf '%s\n' '{"repository":"surumeneco/Eternalia_Novel","commit":"2fe68c8b14b77f8dd2a9a2a51c777cf6adc0438a","tree":"416cbe1e5e95576b626a1d1fb423ed5df5dd266f"}' > manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: project-snapshot-2fe68c8b
          path: ${{ runner.temp }}/chat-snapshot/
          retention-days: 1
