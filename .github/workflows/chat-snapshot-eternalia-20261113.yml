name: Chat snapshot Eternalia 20261113
on:
  push:
    branches: [infra/chat-eternalia-snapshot-20261112b]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 884b15fce8069828d277cc72f46e8ac75eaae529
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "884b15fce8069828d277cc72f46e8ac75eaae529"
          test "$(git rev-parse HEAD^{tree})" = "48ddb7bc2dcc2a70799d615ac74ad904cf434476"
          git archive --format=tar.gz --prefix=project/ --output=project-source.tar.gz 884b15fce8069828d277cc72f46e8ac75eaae529
          printf '{"repository":"surumeneco/Eternalia_Novel","commit":"884b15fce8069828d277cc72f46e8ac75eaae529","tree":"48ddb7bc2dcc2a70799d615ac74ad904cf434476"}\n' > snapshot-manifest.json
          sha256sum project-source.tar.gz > snapshot.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chat-eternalia-source-884b15f
          path: |
            project-source.tar.gz
            snapshot-manifest.json
            snapshot.sha256
          retention-days: 1
          if-no-files-found: error
