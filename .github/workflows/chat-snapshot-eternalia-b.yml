name: Chat snapshot Eternalia B
on:
  push:
    branches: [infra/chat-eternalia-snapshot-20261112b]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 033bf7a54c55685d72c015f627a101e837027c44
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "033bf7a54c55685d72c015f627a101e837027c44"
          test "$(git rev-parse HEAD^{tree})" = "15190a7324de8e11de423d5894448c5079f1178f"
          git archive --format=tar.gz --prefix=project/ --output=project-source.tar.gz "033bf7a54c55685d72c015f627a101e837027c44"
          printf '{"repository":"surumeneco/Eternalia_Novel","commit":"033bf7a54c55685d72c015f627a101e837027c44","tree":"15190a7324de8e11de423d5894448c5079f1178f"}\n' > snapshot-manifest.json
          sha256sum project-source.tar.gz > snapshot.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chat-eternalia-source-033bf7
          path: |
            project-source.tar.gz
            snapshot-manifest.json
            snapshot.sha256
          retention-days: 1
          if-no-files-found: error
