name: W07 issue 209 actual browser reproduction
on:
  push:
    branches: [infra/w07-209-rename-repro]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eternalia_http
          POSTGRES_USER: eternalia
          POSTGRES_PASSWORD: ci-temp-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U eternalia -d eternalia_http"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://eternalia:ci-temp-password@127.0.0.1:5432/eternalia_http
      NODE_ENV: test
      HTTP_ACCEPTANCE_DISPOSABLE_DB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run db:migrate
      - run: node scripts/w07-209-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w07-209-browser-junit
          path: artifacts/alpha-junit
          if-no-files-found: warn
