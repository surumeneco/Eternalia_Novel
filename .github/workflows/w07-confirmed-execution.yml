name: W07 confirmed current execution
on:
  push:
    branches: ['infra/chat-acceptance-snapshot-853ee0c0']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eternalia_http
          POSTGRES_USER: eternalia
          POSTGRES_PASSWORD: ci-temp-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U eternalia -d eternalia_http"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgres://eternalia:ci-temp-password@127.0.0.1:5432/eternalia_http
      NODE_ENV: test
      HTTP_ACCEPTANCE_DISPOSABLE_DB: '1'
      HTTP_BASE_URL: http://127.0.0.1:34110
      HTTP_API_URL: http://127.0.0.1:34111
      API_PORT: '34111'
      NITRO_PORT: '34110'
      NUXT_API_INTERNAL_URL: http://127.0.0.1:34111
      APP_ORIGIN: http://127.0.0.1:34110
      DISCORD_CLIENT_ID: '123456789012345678'
      DISCORD_CLIENT_SECRET: test-placeholder-not-a-discord-secret
      DISCORD_AUTHOR_USER_ID: '123456789012345678'
      HTTP_ACCEPTANCE_TEST_AUTHOR_ID: '123456789012345678'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'c1f4a6a9c453f54692963726c7ed3b8afd639761'
          persist-credentials: false
          path: project
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: d42557a7b8318925f172b401d4e2bf55c4d230c7
          persist-credentials: false
          path: cat
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare fixed product and genuine browser runner
        working-directory: project
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'c1f4a6a9c453f54692963726c7ed3b8afd639761'
          test "$(git rev-parse HEAD^{tree})" = '40c881b547037e66945107144a246f5a1d2aea66'
          test "$(git -C ../cat rev-parse HEAD:.cat-system)" = eeb6cdbd008dedc261f1df380b92f8052be0c045
          git checkout -B feature/w07-confirmed-current-execution 'c1f4a6a9c453f54692963726c7ed3b8afd639761'
          mkdir -p "$RUNNER_TEMP/w07-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/w07-evidence/project-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/w07-evidence/project-tree.txt"
          git -C ../cat rev-parse HEAD > "$RUNNER_TEMP/w07-evidence/cat-commit.txt"
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 vitest@3.2.4
          npx playwright install --with-deps chromium
          npm run build
          npm run db:migrate
      - name: Execute all declared current items independently
        working-directory: project
        run: |
          set -euo pipefail
          export HTTP_FIXTURE_FILE="$RUNNER_TEMP/fixture.json"
          export D="$RUNNER_TEMP/w07-evidence"
          export F="$(realpath ../cat/.cat-system/scripts/cat_flow.py)"
          node scripts/seed-http-acceptance.mjs
          node apps/api/dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          A=$!
          node apps/web/.output/server/index.mjs > "$RUNNER_TEMP/web.log" 2>&1 &
          B=$!
          trap 'kill "$A" "$B" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS "$HTTP_BASE_URL/" >/dev/null && curl -fsS "$HTTP_API_URL/api/health" >/dev/null && break; sleep 1; done
          curl -fsS "$HTTP_BASE_URL/" >/dev/null
          python - <<'PY'
          import pathlib,json,subprocess,os,sys,shutil
          D=pathlib.Path(os.environ['D']); F=os.environ['F']
          def invoke(args, output):
              p=subprocess.run([sys.executable,F,*args],text=True,capture_output=True)
              output.write_text(p.stdout)
              output.with_suffix('.stderr').write_text(p.stderr)
              output.with_suffix('.exit').write_text(str(p.returncode))
              return p.returncode
          summary=[]
          for w in sorted(pathlib.Path('Lifecycle/Works/New').glob('*/work.json')):
              doc=json.loads(w.read_text())
              if doc.get('id')!='eternalia.ui.admin-navigation':continue
              C=doc['compilation']; out=D/doc['id'];out.mkdir()
              row={'work':doc['id'],'done':0,'total':None,'gate':None}
              def run(cmd,kind,name):
                  return invoke([cmd,'--work',str(w),*kind],out/(name+'.json'))
              try:
                  for cmd,args,name in [('conformance',['--kind','process-closure'],'closure'),('compile',['--kind','model'],'model'),('conformance',['--kind','model-conformance'],'model-conformance'),('compile',['--kind','vectors'],'vectors'),('compile',['--kind','queue'],'queue'),('obligations',[],'obligations')]:
                      if run(cmd,args,name):raise RuntimeError(name)
                  q=w.parent/C['queue']
                  row['total']=len(json.loads(q.read_text())['items'])
                  while True:
                      current=next((x for x in json.loads(q.read_text())['items'] if x['status']=='current'),None)
                      if current is None:break
                      expected=doc['scope']['process_ids'][0]+' CAT symbolic contract > '+current['id']
                      checks=[x for x in doc['checks'] if x['stage']=='green' and expected in x['test_ids']]
                      if len(checks)!=1:raise RuntimeError('missing unique Green check '+expected)
                      ck=checks[0]['id']; n=str(current['order'])+'-'+ck
                      if run('compile',['--kind','tests'],n+'-tests'):raise RuntimeError(n+'-tests')
                      if run('run',['--id',ck,'--execute'],n):raise RuntimeError(n+'-run')
                      receipt=w.parent/'.cat-flow/evidence'/(ck+'.json')
                      if run('queue-state',['--evidence',str(receipt)],n+'-queue'):raise RuntimeError(n+'-queue')
                      row['done']+=1
                  row['execution']='complete'
              except Exception as e:row['execution']=str(e)
              try:
                  run('conformance',['--kind','implementation-conformance'],'implementation')
                  row['gate']=json.loads((out/'implementation.json').read_text()).get('status')
                  evaluated=w.parent/'.cat-flow/cache/implementation-obligations-evaluated.json'
                  if evaluated.is_file():
                      ob=json.loads(evaluated.read_text())['items']
                      row['obligations']={k:sum(x['status']==k for x in ob) for k in sorted({x['status'] for x in ob})}
              except Exception as e:row['gate_error']=str(e)
              for rel in ['.cat-flow','CAT/Generated']:
                  p=w.parent/rel
                  if p.exists():shutil.copytree(p,out/rel,dirs_exist_ok=True)
              shutil.copy2(w,out/'work.json')
              summary.append(row)
              print(json.dumps(row,ensure_ascii=False),flush=True)
              (D/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Generate and run confirmed master delete suite
        working-directory: project
        run: |
          set -euo pipefail
          W=Lifecycle/Works/New/eternalia.master.delete-admission/work.json
          D="$RUNNER_TEMP/w07-evidence/master-delete-suite"
          mkdir -p "$D"
          F=../cat/.cat-system/scripts/cat_flow.py
          S=../cat/.cat-system/scripts/cat_spec_test_sync.py
          python "$F" conformance --work "$W" --kind process-closure > "$D/process-closure.json"
          python "$F" compile --work "$W" --kind model > "$D/model.json"
          python "$F" conformance --work "$W" --kind model-conformance > "$D/model-conformance.json"
          python "$F" compile --work "$W" --kind vectors > "$D/vectors.json"
          for phase in plan sync verify run report; do
            python "$S" "$phase" --work "$W" --repo . --repo-revision "$(git rev-parse HEAD)" --prefix packages/contracts/tests/generated/ --manifest .cat-flow/test-suite-manifest.master-delete.json --check-id suite-master-delete-3 --report-path .cat-flow/evidence/test-suite-master-delete.json > "$D/$phase.json"
          done
          mkdir -p "$D/publish/packages/contracts/tests/generated" "$D/publish/.cat-flow"
          cp packages/contracts/tests/generated/cat_case_delete_*.test.ts "$D/publish/packages/contracts/tests/generated/"
          cp .cat-flow/test-suite-manifest.master-delete.json "$D/publish/.cat-flow/"
          cp -a "$(dirname "$W")/.cat-flow" "$D/"
          cp .cat-flow/evidence/test-suite-master-delete.json "$D/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w07-admin-master-confirmed-execution
          path: ${{ runner.temp }}/w07-evidence/
          include-hidden-files: true
