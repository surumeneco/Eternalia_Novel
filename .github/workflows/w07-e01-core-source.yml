name: W07 fixed core source transfer
on:
  push:
    branches: [infra/w07-e01-core-snapshot-b524948]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 1ce835dbff6148560c9cc055907bec33d3f45d4b
          persist-credentials: false
      - name: Archive fixed core tree
        run: |
          test "$(git rev-parse HEAD)" = "1ce835dbff6148560c9cc055907bec33d3f45d4b"
          test "$(git rev-parse HEAD^{tree})" = "7dc74b965b365b3110b959eab48483fe760f7dae"
          mkdir -p /tmp/cat-source
          git archive --format=tar.gz --output=/tmp/cat-source/core.tar.gz HEAD
          git cat-file commit HEAD > /tmp/cat-source/core.commit
      - uses: actions/upload-artifact@v4
        with:
          name: w07-e01-core-1ce835
          path: /tmp/cat-source/
          if-no-files-found: error
          compression-level: 0
