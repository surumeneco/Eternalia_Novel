name: W07 read-only CAT snapshot
on:
  push:
    branches: [infra/w07-e01-core-snapshot-b524948]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 8ae275f9689021085eedb388f63457691b0d589a
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD)" = "8ae275f9689021085eedb388f63457691b0d589a"
          test "$(git rev-parse HEAD^{tree})" = "6f20dcd2f202c93ce3e6e5fbcb3fe94f60f8fa9a"
          mkdir -p /tmp/cat-source
          git archive --format=tar.gz --output=/tmp/cat-source/core.tar.gz HEAD
          git cat-file commit HEAD > /tmp/cat-source/core.commit
      - uses: actions/upload-artifact@v4
        with:
          name: w07-readonly-core-8ae275f
          path: /tmp/cat-source/
          if-no-files-found: error
          compression-level: 0
