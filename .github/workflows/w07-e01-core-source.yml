name: W07 product fixed source transfer
on:
  push:
    branches: [infra/w07-e01-core-snapshot-b524948]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 83245ac80b2faa24c10fe09f1b743e49defaf49a
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD)" = "83245ac80b2faa24c10fe09f1b743e49defaf49a"
          test "$(git rev-parse HEAD^{tree})" = "3eb7fae79d2cb7b536d736aae9429b6b705dedb9"
          mkdir -p /tmp/product-source
          git archive --format=tar.gz --output=/tmp/product-source/product.tar.gz HEAD
          git cat-file commit HEAD > /tmp/product-source/product.commit
      - uses: actions/upload-artifact@v4
        with:
          name: w07-product-83245ac
          path: /tmp/product-source/
          if-no-files-found: error
          compression-level: 0
