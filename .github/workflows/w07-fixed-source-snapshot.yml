name: W07 fixed source snapshot
on:
  push:
    branches: [infra/chat-acceptance-snapshot-853ee0c0]
    paths: ['.github/workflows/w07-fixed-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/Eternalia_Novel
          ref: 4cf6eafffa00035d4295bafa8017d6154f3ef9c5
          path: project
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: c7b9178d9c78ef2f48c2a6eaa76494f3cd54dbe5
          path: cat
      - name: Export fixed trees only
        shell: bash
        run: |
          set -eu
          mkdir snapshot
          for name in project cat; do
            git -C "$name" rev-parse HEAD > "snapshot/$name.commit"
            git -C "$name" rev-parse HEAD^{tree} > "snapshot/$name.tree"
            git -C "$name" archive --format=tar.gz --output="$PWD/snapshot/$name.tar.gz" HEAD
          done
          test "$(cat snapshot/project.tree)" = d4b580e43c85532c2dd5e52ed2b639512d6e21b8
          test "$(cat snapshot/cat.tree)" = 8c784d8f851561d6bf52dadcf7e0d8c496bb5311
          sha256sum snapshot/*.tar.gz > snapshot/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: w07-fixed-sources
          path: snapshot/
          retention-days: 7
