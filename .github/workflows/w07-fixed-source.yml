name: W07 fixed source transfer
on:
  push:
    branches: [infra/w07-source-00b75e00]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 00b75e00a59aa729ad8ec87801fb64d66c802f84
          persist-credentials: false
      - name: Archive fixed tree
        run: |
          test "$(git rev-parse HEAD)" = "00b75e00a59aa729ad8ec87801fb64d66c802f84"
          test "$(git rev-parse HEAD^{tree})" = "a143e6955784e0d8e721b53f7c3bdd4028924698"
          mkdir -p /tmp/w07-source
          git archive --format=tar.gz --output=/tmp/w07-source/product.tar.gz HEAD
          git cat-file commit HEAD > /tmp/w07-source/product.commit
      - uses: actions/upload-artifact@v4
        with:
          name: w07-source-00b75e00
          path: /tmp/w07-source/
          if-no-files-found: error
          compression-level: 0
