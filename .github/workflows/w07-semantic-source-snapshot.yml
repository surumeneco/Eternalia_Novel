name: W07 immutable product source transfer
on:
  push:
    branches: [infra/w07-semantic-snapshot-961d291f]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 961d291f493df219ac36cf88108d302d680c51ef
          persist-credentials: false
          fetch-depth: 1
      - name: Archive exact tree and original commit object
        run: |
          test "$(git rev-parse HEAD)" = "961d291f493df219ac36cf88108d302d680c51ef"
          test "$(git rev-parse HEAD^{tree})" = "37cfef09996e7fc3c10e3306fd8f3f9facc381ab"
          mkdir -p /tmp/w07-source
          git archive --format=tar.gz --output=/tmp/w07-source/project.tar.gz HEAD
          git cat-file commit HEAD > /tmp/w07-source/commit.raw
          cd /tmp/w07-source
          sha256sum project.tar.gz commit.raw
      - uses: actions/upload-artifact@v4
        with:
          name: w07-semantic-source-961d291f
          path: /tmp/w07-source/
          if-no-files-found: error
          compression-level: 0
