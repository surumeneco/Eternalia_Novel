<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Eternalia — 作者の書斎</title><link rel="stylesheet" href="/assets/style.css" /></head>
<body><header class="topbar"><div class="brand"><span class="logo" aria-hidden="true">E</span><div><strong>Eternalia</strong><small>Author Studio α</small></div></div><nav aria-label="メインメニュー"><a href="/">公開作品</a><a class="active" href="/admin">作者用</a></nav></header>
<main class="container workspace"><div class="studio-title"><div><p class="eyebrow">WRITING STUDIO</p><h1>作者の書斎</h1><p>編集した下書きは、明示的に公開版を更新するまで読者には反映されません。</p></div><span class="environment">ローカル検証専用 / Discord認証なし</span></div>
<div id="auth-status" class="status" role="status"></div><div id="studio" hidden class="studio"><aside class="panel sidebar"><div class="sidebar-header"><h2>ライブラリ</h2><button id="refresh" type="button" class="ghost compact">再読込</button></div><div class="tabs" id="tabs" role="group" aria-label="資料種別"><button data-filter="all" class="selected">すべて</button><button data-filter="story">執筆</button><button data-filter="settings">設定</button><button data-filter="dictionary">辞書</button><button data-filter="timeline">年表</button></div><div class="tree" id="manage-tree"></div><div class="sidebar-actions"><button id="create-first" type="button">＋ 新規作成</button></div></aside>
<section class="editor panel"><div id="empty-selection"><h2>記録したい世界を選ぶ</h2><p>左側の一覧から項目を選択するか、新規作成してください。</p></div><div id="edit-form" hidden><div class="editor-head"><div><span id="item-kind" class="eyebrow"></span><h2 id="item-heading">編集</h2><span id="item-meta" class="meta"></span></div><div class="actions"><button id="new-child" type="button" class="ghost">＋ 子項目</button></div></div>
<form id="content-form"><label>名称・見出し<input type="text" name="title" id="field-title" maxlength="150" required autocomplete="off"></label><label>本文・説明<textarea name="body" id="field-body" rows="14" maxlength="100000" placeholder="ここに本文を記入します。ページ区切りは [[page]]、ルビは ｜漢字《かんじ》 の形式で入力できます。"></textarea></label><div id="details-fields"></div><div class="actions"><button id="save" type="submit">下書きを保存</button><button id="preview" class="ghost" type="button">下書きプレビュー</button></div></form>
<hr><section class="publication"><h3>公開設定</h3><p class="small-muted">公開版の更新は下書き保存とは別の操作です。上位項目が非公開なら子項目も読者に見えません。</p><div id="publication-summary" class="small-muted"></div><div class="actions"><button id="publish" type="button" class="secondary">現在の下書きを公開版へ反映</button><button id="toggle-visible" type="button" class="ghost"></button><label class="date-field">公開開始日時（任意）<input id="pub-date" type="datetime-local"></label><button id="schedule" class="ghost" type="button">日時を設定</button></div></section><hr><section><h3>プレビュー</h3><div id="draft-preview" class="preview-surface"></div></section></div></section></div></main><footer>α版の編集画面はローカル限定です。インターネットへ公開しないでください。</footer><script type="module" src="/assets/admin.js"></script></body></html>
